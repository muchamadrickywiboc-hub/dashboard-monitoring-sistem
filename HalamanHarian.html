<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--forest:#4a7a53;--forest-d:#3f6e4b;--ink:#1d2421;--muted:#5f6b64;--line:#d9dfdb;--bg:#f3f5f3;--card:#fff;--navy:#1f3864;--err:#b3261e;--ok:#2e7d32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.bar{background:linear-gradient(120deg,var(--forest-d),var(--forest) 45%,#7aa64a);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.bar h1{font-size:16px;margin:0;font-weight:700}
.bar small{opacity:.9}
.bar .akun{display:flex;gap:8px;align-items:center;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--forest)}
.btn.pri{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.pri:hover{background:var(--forest-d)}
.btn:disabled{opacity:.6;cursor:default}
.bar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.tools{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tools label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px;background:#fff;min-width:0;max-width:100%}
.tools .sp{flex:1}
.note{margin:10px 0 0;font-size:13px;color:var(--muted)}
.note.warn{color:#8a5a00}
.note.err{color:var(--err)}
.prev{margin-top:12px;background:#e6e9e7;border-radius:12px;padding:12px;overflow:hidden}
.prev .sk{transform-origin:0 0;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
#login{max-width:420px;margin:40px auto}
#login h2{margin:0 0 4px;font-size:18px}
#login p{margin:0 0 14px;color:var(--muted);font-size:13px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;color:var(--ink);background:#fff;width:100%}
.msg{min-height:20px;color:var(--err);font-size:13px;margin-bottom:8px}
dialog{border:none;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,30,25,.45)}
.dlg{padding:18px}
.dlg h3{margin:0 0 4px;font-size:17px}
.dlg .sub{margin:0 0 14px;font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.grp b{display:block;font-size:13px;margin-bottom:6px}
.grp .off{font-size:12px;color:var(--muted);margin-top:4px}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9d3cc;border-top-color:var(--forest);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:600px){.grid3{grid-template-columns:1fr 1fr}.wrap{padding:12px}.tools label{flex:1 1 140px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar">
  <div><h1>Laporan Harian Operasional GPS &amp; Dashcam</h1></div>
  <div class="akun" id="akunBox" hidden><span id="akunNama"></span><a class="btn" id="btnDash" target="_top" href="#" hidden style="text-decoration:none">Dashboard</a><button class="btn" id="btnKeluar" type="button">Keluar</button></div>
</div>

<div class="wrap">
  <div class="note" id="boot"><span class="spin"></span>Memuat halaman…</div>
  <form class="card" id="login" hidden>
    <h2>Masuk</h2>
    <p>Gunakan akun yang sama dengan dashboard bulanan (RTC, Command Center, atau Control Room).</p>
    <label class="fld">Akun<select id="lgU"><option value="">Memuat daftar akun…</option></select></label>
    <label class="fld">Password<input id="lgP" type="password" autocomplete="current-password"></label>
    <div class="msg" id="lgErr"></div>
    <button class="btn pri" id="lgBtn" type="submit" style="width:100%">Masuk</button>
  </form>

  <div id="app" hidden>
    <div class="tools">
      <label>Tanggal<input type="date" id="fTgl"></label>
      <label id="lArea">Area<select id="fArea"></select></label>
      <label id="lLok">Lokasi<select id="fLok"></select></label>
      <button class="btn pri" id="btnTampil" type="button">Tampilkan</button>
      <span class="sp"></span>
      <button class="btn" id="btnInput" type="button">Input GPS / Dashcam / RTC</button>
      <button class="btn pri" id="btnPdf" type="button" disabled>Export PDF</button>
    </div>
    <div class="note" id="note"></div>
    <div class="prev" id="prev"><div class="note"><span class="spin"></span>Memuat…</div></div>
  </div>
</div>

<dialog id="dlg">
  <form class="dlg" id="fInput" method="dialog">
    <h3>Input harian GPS, Dashcam &amp; RTC</h3>
    <p class="sub" id="inSub">Diisi oleh Control Room setiap hari. Offline dihitung otomatis.</p>
    <div class="grid2">
      <label class="fld">Tanggal<input type="date" id="inTgl" required></label>
      <label class="fld">Lokasi<select id="inLok"></select></label>
    </div>
    <div class="grp"><b>GPS</b><div class="grid2">
      <label class="fld">Jumlah MT terpasang GPS<input type="number" min="0" step="1" id="inGpsT" required></label>
      <label class="fld">Online<input type="number" min="0" step="1" id="inGpsO" required></label></div><div class="off" id="offGps"></div></div>
    <div class="grp"><b>Dashcam</b><div class="grid2">
      <label class="fld">Jumlah MT terpasang Dashcam<input type="number" min="0" step="1" id="inCamT" required></label>
      <label class="fld">Online<input type="number" min="0" step="1" id="inCamO" required></label></div><div class="off" id="offCam"></div></div>
    <div class="grp"><b>RTC</b><div class="grid2">
      <label class="fld">Jumlah RTC<input type="number" min="0" step="1" id="inRtcT" required></label>
      <label class="fld">Online<input type="number" min="0" step="1" id="inRtcO" required></label></div><div class="off" id="offRtc"></div></div>
    <div class="grid2">
      <label class="fld">Nama Operator<input id="inOp" maxlength="80"></label>
      <label class="fld">Nama Fleet Supervisor<input id="inSv" maxlength="80"></label>
    </div>
    <div class="msg" id="inErr"></div>
    <div class="row-end"><button class="btn" type="button" id="inBatal">Batal</button><button class="btn pri" type="submit" id="inSimpan">Simpan</button></div>
  </form>
</dialog>

<script>
/* Bila skrip gagal, tampilkan pesannya (jangan halaman kosong) */
window.onerror = (m, src, baris) => {
  const b = document.getElementById('boot'); if (!b) return;
  b.hidden = false; b.className = 'note err';
  b.textContent = 'Halaman gagal dimuat: ' + m + (baris ? ' (baris ' + baris + ')' : '') + '.';
  // tampilkan isi baris di sekitar error apa adanya, untuk melacak bagian kode yang berubah saat disajikan
  if (baris) { const L = document.documentElement.outerHTML.split('\n'), pre = document.createElement('pre');
    pre.style.cssText = 'white-space:pre-wrap;word-break:break-all;font-size:11px;background:#fff;border:1px solid #ddd;padding:8px;color:#333';
    pre.textContent = L.slice(Math.max(0, baris - 4), baris + 2).map((x, i) => (Math.max(0, baris - 4) + i + 1) + ': ' + x.slice(0, 400)).join('\n');
    b.appendChild(pre); }
};
</script>

const PW = 1123, PH = 794;   // A4 lanskap dalam px (96 dpi)
const BIRU = '#1f4e79', MERAH = '#e00000', NAVY = '#1f3864', BATANG = '#4472c4', TOTAL = '#c00000';
const BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const SIMPAN = 'dashb_token';   // sama dengan dashboard bulanan, jadi login cukup sekali
let TOKEN = '', INFO = null, LAP = null, LOGO = LOGO_BAWAAN;
try { TOKEN = localStorage.getItem(SIMPAN) || ''; } catch (e) { TOKEN = ''; }
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
const nf = n => Math.round(n || 0).toLocaleString('id-ID');
const judul = s => String(s || '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\b(It|Ft|Tbbm|Tlpg|Dppu)\b/g, x => x.toUpperCase());
const simpanToken = t => { try { t ? localStorage.setItem(SIMPAN, t) : localStorage.removeItem(SIMPAN); } catch (e) { /* tanpa penyimpanan */ } };
const run = (fn, ...a) => new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...a));
const pesan = e => e && e.message ? e.message : String(e);
function nTicks(m) { const ok = x => { const p = Math.pow(10, Math.floor(Math.log10(x))); const r = Math.round(x / p * 100) / 100; return [1, 2, 2.5, 5, 10].includes(r); }; return [5, 4, 3, 6].find(n => ok(m / n)) || 5; }
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => m <= x) * p; }
function tglPanjang(t) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t || ''); return m ? `${+m[3]} ${BLN[+m[2] - 1]} ${m[1]}` : ''; }

/* ================= LOGIN ================= */
function tampilLogin(m) {
  $('app').hidden = true; $('akunBox').hidden = true; $('login').hidden = false; $('lgErr').textContent = m || '';
  run('daftarLogin').then(j => {
    const L = JSON.parse(j), s = $('lgU');
    s.innerHTML = '<option value="">Pilih akun</option>' +
      (L.pusat.length ? `<optgroup label="RTC">${L.pusat.map(a => `<option value="${esc(a.u)}">${esc(a.nama)}</option>`).join('')}</optgroup>` : '') +
      (L.area.length ? `<optgroup label="Command Center">${L.area.map(a => `<option value="${esc(a.u)}">Command Center ${esc(judul(a.area))}</option>`).join('')}</optgroup>` : '') +
      (L.lokasi.length ? `<optgroup label="Control Room">${L.lokasi.map(a => `<option value="${esc(a.u)}">${esc(a.lok)}</option>`).join('')}</optgroup>` : '');
  }).catch(() => { $('lgU').outerHTML = '<input id="lgU" autocomplete="username" placeholder="Username">'; });
}
$('login').onsubmit = e => {
  e.preventDefault();
  const u = $('lgU').value.trim().toLowerCase(), p = $('lgP').value;
  if (!u || !p) { $('lgErr').textContent = 'Pilih akun dan isi password.'; return; }
  $('lgBtn').disabled = true; $('lgErr').textContent = '';
  run('login', u, p).then(j => { TOKEN = JSON.parse(j).token; simpanToken(TOKEN); $('lgP').value = ''; mulai(); })
    .catch(e => { $('lgErr').textContent = pesan(e); }).finally(() => { $('lgBtn').disabled = false; });
};
$('btnKeluar').onclick = () => { TOKEN = ''; simpanToken(''); INFO = LAP = null; tampilLogin(''); };
function cekLogin(e) { if (!/LOGIN/.test(pesan(e))) return false; TOKEN = ''; simpanToken(''); tampilLogin('Sesi berakhir. Silakan masuk lagi.'); return true; }

/* ================= HALAMAN ================= */
function mulai() {
  $('boot').hidden = true;
  if (!TOKEN) return tampilLogin('');
  $('login').hidden = true; $('app').hidden = false;
  $('prev').innerHTML = '<div class="note"><span class="spin"></span>Memuat daftar lokasi…</div>';
  run('lhLogo').then(u => { if (u) LOGO = u; }).catch(() => {});
  run('urlLaporanHarian').then(u => { if (u) { $('btnDash').href = u.replace(/\?laporan=harian$/, ''); $('btnDash').hidden = false; } }).catch(() => {});
  run('lhInfo', TOKEN).then(j => {
    INFO = JSON.parse(j);
    const a = INFO.akun;
    $('akunBox').hidden = false;
    $('akunNama').textContent = a.peran === 'PUSAT' ? 'RTC' : a.peran === 'AREA' ? 'Command Center ' + judul(a.area) : 'Control Room ' + a.lok;
    $('lArea').hidden = a.peran !== 'PUSAT'; $('lLok').hidden = a.peran === 'LOKASI';
    $('fArea').innerHTML = '<option value="">Semua Area</option>' + INFO.areas.map(x => `<option value="${x}">${esc(judul(x))}</option>`).join('');
    isiLokasi();
    if (!$('fTgl').value) { const k = new Date(Date.now() - 864e5); $('fTgl').value = INFO.tanggalAkhir || k.toISOString().slice(0, 10); }
    tampil();
  }).catch(e => { if (!cekLogin(e)) $('prev').innerHTML = `<div class="note err">Gagal memuat: ${esc(pesan(e))}</div>`; });
}
function lokasiCakupan() { const a = $('fArea').value; return INFO.lokasi.filter(o => !a || o.a === a); }
function isiLokasi() {
  const L = lokasiCakupan(), dulu = $('fLok').value;
  $('fLok').innerHTML = '<option value="">Semua lokasi</option>' + L.map(o => `<option value="${esc(o.n)}">${esc(o.n)}</option>`).join('');
  if (L.some(o => o.n === dulu)) $('fLok').value = dulu;
}
$('fArea').onchange = () => { isiLokasi(); tampil(); };
$('fLok').onchange = tampil;
$('fTgl').onchange = tampil;
$('btnTampil').onclick = tampil;
let MINTA = 0;
function tampil() {
  if (!INFO || !$('fTgl').value) return;
  const id = ++MINTA;
  $('btnPdf').disabled = true; $('note').className = 'note'; $('note').innerHTML = '<span class="spin"></span>Menyiapkan laporan…';
  run('lhLaporan', TOKEN, $('fTgl').value, $('fArea').value, $('fLok').value).then(j => {
    if (id !== MINTA) return;
    LAP = JSON.parse(j);
    const p = LAP.perangkat, cat = [];
    if (!LAP.adaEvent) cat.push(`Belum ada data event untuk ${tglPanjang(LAP.tanggal)}${LAP.sumber ? '' : ' (file tarikan bulan ini belum ada di folder data)'}. Pastikan file tarikan tanggal ini sudah diunggah.`);
    if (p.lokasiInput < p.lokasiCakupan) cat.push(`Data GPS/Dashcam/RTC baru diisi ${p.lokasiInput} dari ${p.lokasiCakupan} ${LAP.baris === 'Area' ? 'lokasi' : 'lokasi dalam cakupan'}. Klik "Input GPS / Dashcam / RTC".`);
    const kosong = LAP.panel.filter(x => !x.total).map(x => x.grafik);
    if (LAP.adaEvent && kosong.length) cat.push('Tanpa event: ' + kosong.join(', ') + '.');
    $('note').className = 'note' + (cat.length ? ' warn' : ''); $('note').textContent = cat.join(' ') || `Sumber event: ${LAP.sumber}.`;
    gambarPreview(); $('btnPdf').disabled = false;
  }).catch(e => { if (id !== MINTA || cekLogin(e)) return; $('note').className = 'note err'; $('note').textContent = 'Gagal: ' + pesan(e); });
}
function gambarPreview() {
  const box = $('prev'); box.innerHTML = '';
  const sk = document.createElement('div'); sk.className = 'sk';
  const pg = halaman(LAP); sk.appendChild(pg); box.appendChild(sk);
  const skala = () => { const w = box.clientWidth - 24, s = Math.min(1, w / PW), h = pg.offsetHeight; sk.style.transform = `scale(${s})`; sk.style.width = PW + 'px'; box.style.height = (h * s + 24) + 'px'; };
  skala(); window.onresize = skala;
}

/* ================= HALAMAN LAMPIRAN 3A ================= */
const td = 'border:1px solid #000;padding:0 3px;height:12px;line-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
function tabelPerangkat(judulT, kolom, b, lbl) {
  const ada = b.terpasang > 0, off = Math.max(0, b.terpasang - b.online), pct = ada ? Math.round(b.online / b.terpasang * 100) + '%' : '–';
  const r = (k, v, tebal) => `<tr${tebal ? ' style="font-weight:700"' : ''}><td style="${td}">${k}</td><td style="${td};text-align:right">${v}</td></tr>`;
  return `<table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.5px"><colgroup><col><col style="width:48px"></colgroup>
    <tr style="background:${NAVY};color:#fff;font-weight:700"><td style="${td};text-align:center">${judulT}</td><td style="${td};text-align:center">${kolom}</td></tr>
    ${r(lbl[0], ada ? nf(b.terpasang) : '–')}${r('Online', ada ? nf(b.online) : '–')}${r('Offline', ada ? nf(off) : '–')}${r(lbl[1], pct, 1)}</table>`;
}
function panelEvent(e, n, w, chartH, putar) {
  const data = e.rows.map(r => ({n: judul(r.n), v: r.v})).concat([{n: 'Total', v: e.total, t: 1}]);
  const isi = e.rows.map(r => `<tr><td style="${td}">${esc(judul(r.n))}</td><td style="${td};text-align:right">${nf(r.v)}</td></tr>`).join('') +
    Array.from({length: n - e.rows.length}, () => `<tr><td style="${td}">&nbsp;</td><td style="${td}"></td></tr>`).join('');
  const tabel = `<table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.5px"><colgroup><col><col style="width:40px"></colgroup>
    <tr style="background:${NAVY};color:#fff;font-weight:700"><td style="${td};text-align:center">${esc(e.tabel)}</td><td style="${td};text-align:center">Case</td></tr>
    ${isi}<tr style="font-weight:700"><td style="${td}">Total</td><td style="${td};text-align:right">${nf(e.total)}</td></tr></table>`;
  let mx = niceMax(Math.max(1, e.total) * 1.05), nt = nTicks(mx); if (mx < 5) { mx = 5; nt = 5; } else if (mx / nt < 1) nt = mx;
  const labelH = putar ? 46 : 12, plotH = Math.max(40, chartH - 26 - labelH - 6), plotW = w - 38, bw = plotW / data.length;
  const ticks = Array.from({length: nt + 1}, (_, i) => mx / nt * i);
  const grafik = `<div style="position:relative;height:${chartH}px;margin-top:5px;border:1px solid #d9d9d9;background:#fff">
    <div style="text-align:center;font-size:10.5px;color:#595959;padding-top:6px;white-space:nowrap">${esc(e.grafik)}</div>
    <div style="position:absolute;left:32px;right:6px;top:26px;height:${plotH}px">
      ${ticks.map(t => `<div style="position:absolute;left:0;right:0;bottom:${t / mx * 100}%;border-top:1px solid ${t ? '#e6e6e6' : '#bfbfbf'}"></div><div style="position:absolute;left:-30px;width:26px;text-align:right;bottom:${t / mx * 100}%;transform:translateY(50%);font-size:6.5px;color:#595959">${nf(t)}</div>`).join('')}
      ${data.map((r, i) => `<div style="position:absolute;bottom:0;left:${i * bw + bw * 0.12}px;width:${bw * 0.76}px;height:${r.v / mx * 100}%;background:${r.t ? TOTAL : BATANG}"></div>`).join('')}
    </div>
    <div style="position:absolute;left:32px;right:6px;top:${26 + plotH + 3}px;height:${labelH}px">
      ${data.map((r, i) => putar
        ? `<div style="position:absolute;left:${i * bw + bw / 2 + 3}px;top:0;width:${labelH}px;height:7px;line-height:7px;transform-origin:0 0;transform:rotate(90deg);font-size:5.5px;color:#595959;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.n)}</div>`
        : `<div style="position:absolute;left:${i * bw}px;width:${bw}px;text-align:center;font-size:5.5px;color:#595959;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.n)}</div>`).join('')}
    </div></div>`;
  return `<div style="width:${w}px;flex:none">${tabel}${grafik}</div>`;
}
/** Membuat satu halaman (elemen DOM, lebar PW). Tinggi bertambah bila lokasinya banyak; saat export diperkecil agar muat 1 halaman A4. */
function halaman(L) {
  const M = 14, G = 9, cols = 7, w = Math.floor((PW - 2 * M - (cols - 1) * G) / cols);
  const n = Math.max(3, ...L.panel.map(e => e.rows.length)), tabelH = (n + 2) * 12 + 1;
  const putar = n > 3 || L.panel.some(e => e.rows.some(r => r.n.length > 12));
  const atasH = 60, pieH = 110, perangkatH = 5 * 12 + 1 + 6 + pieH, jarak = 14, ttdH = 82;
  const sisa = PH - M - 10 - atasH - perangkatH - jarak - G - 6 - ttdH - 2 * (tabelH + 5);
  const chartH = Math.max(110, Math.floor(sisa / 2) - 2);
  const P = L.perangkat, wD = w + 24;
  const blokPerangkat = (judulT, kolom, b, lbl, judulPie, id) => `<div style="width:${wD}px;flex:none">${tabelPerangkat(judulT, kolom, b, lbl)}
    <div style="margin-top:6px;border:1px solid #d9d9d9;height:${pieH}px;position:relative"><div style="text-align:center;font-size:12.5px;font-weight:700;color:#595959;padding-top:4px">${judulPie}</div>
    <canvas data-pie="${id}" style="position:absolute;left:0;top:22px;width:${wD - 2}px;height:${pieH - 24}px"></canvas></div></div>`;
  const baris1 = L.panel.slice(0, 7), baris2 = L.panel.slice(7);
  const el = document.createElement('div');
  el.style.cssText = `width:${PW}px;min-height:${PH}px;background:#fff;color:#000;font-family:Calibri,Carlito,Arial,sans-serif;padding:${M}px ${M}px 10px;box-sizing:border-box;position:relative`;
  el.innerHTML = `
    <div style="height:${atasH}px;position:relative;font-size:9.5px;font-weight:700;line-height:13px">
      <div>LAMPIRAN 3A</div><div>LAPORAN HARIAN OPERASIONAL GPS &amp; DASHCAM</div>
      <div>TANGGAL : ${esc(tglPanjang(L.tanggal))}</div><div>LOKASI : ${esc(L.baris === 'Area' ? L.lokasi : judul(L.lokasi))}</div>
      <img src="${LOGO}" alt="" style="position:absolute;left:${M + 615}px;top:4px;height:36px;width:auto">
    </div>
    <div style="display:flex;gap:${G + 6}px;height:${perangkatH}px">
      ${blokPerangkat('GPS Offline', 'Unit GPS', P.gps, ['Jumlah MT Terpasang GPS', '% MT Online GPS'], 'GPS Status', 'gps')}
      ${blokPerangkat('Dashcam Offline', 'Jumlah Unit', P.dashcam, ['Jumlah MT Terpasang Dashcam', '% MT Online Dashcam'], 'Dashcam Status', 'dashcam')}
      ${blokPerangkat('RTC Offline', 'Unit', P.rtc, ['Jumlah RTC', '% RTC Online'], 'RTC Status', 'rtc')}
    </div>
    <div style="height:${jarak}px"></div>
    <div style="display:flex;gap:${G}px">${baris1.map(e => panelEvent(e, n, w, chartH, putar)).join('')}</div>
    <div style="height:${G}px"></div>
    <div style="display:flex;gap:${G}px">${baris2.map(e => panelEvent(e, n, w, chartH, putar)).join('')}</div>
    <div style="height:${ttdH}px;position:relative;font-size:9.5px;margin-top:6px">
      <div style="position:absolute;left:0;top:22px;font-weight:700">Operator</div>
      <div style="position:absolute;left:${PW * 0.42}px;top:4px;line-height:13px">Disetujui Oleh,<br><b>PT Pertamina Patra Niaga</b><br><b>Fleet Supervisor</b></div>
      <div style="position:absolute;left:0;bottom:4px">Nama${L.operator ? ' : ' + esc(L.operator) : ''}</div>
      <div style="position:absolute;left:${PW * 0.42}px;bottom:4px">Nama${L.supervisor ? ' : ' + esc(L.supervisor) : ''}</div>
    </div>`;
  return el;
}
/** Pie chart di elemen canvas (html2canvas menyalin isi canvas apa adanya). */
function gambarPie(cv, b) {
  const r0 = window.devicePixelRatio > 1 ? 3 : 2, W = cv.clientWidth || parseFloat(cv.style.width), H = cv.clientHeight || parseFloat(cv.style.height);
  cv.width = W * r0; cv.height = H * r0;
  const c = cv.getContext('2d'); c.scale(r0, r0);
  const cx = W / 2 - 8, cy = H / 2, R = Math.min(H / 2 - 4, 46);
  const off = Math.max(0, b.terpasang - b.online), tot = b.terpasang;
  c.font = 'bold 7px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
  if (!tot) { c.fillStyle = '#e3e6e4'; c.beginPath(); c.arc(cx, cy, R, 0, 2 * Math.PI); c.fill(); c.fillStyle = '#737b76'; c.font = '8px Arial'; c.fillText('Belum diinput', cx, cy); return; }
  const potong = [[b.online, BIRU], [off, MERAH]];
  let a = -Math.PI / 2;
  potong.forEach(([v, warna]) => { if (!v) return; const s = v / tot * 2 * Math.PI; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, a, a + s); c.closePath(); c.fillStyle = warna; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 0.8; c.stroke(); a += s; });
  // label persen dalam kotak gelap seperti contoh
  a = -Math.PI / 2;
  const pOn = Math.round(b.online / tot * 100), label = [[b.online, pOn + '%'], [off, (100 - pOn) + '%']];
  label.forEach(([v, t], i) => {
    const s = v / tot * 2 * Math.PI, m = a + s / 2, rr = !v ? R * 0.55 : s > 5.5 ? R * 0.45 : R * 0.62;
    const x = !v ? cx : cx + Math.cos(m) * rr, y = !v ? cy - R * 0.45 : cy + Math.sin(m) * rr + (i === 0 && s > 5.5 ? R * 0.2 : 0);
    const lw = c.measureText(t).width + 6; c.fillStyle = '#404040'; c.fillRect(x - lw / 2, y - 5, lw, 10); c.fillStyle = '#fff'; c.fillText(t, x, y + 0.5); a += s;
  });
  // legenda
  c.textAlign = 'left'; c.font = '6.5px Arial';
  [['Online', BIRU], ['Offline', MERAH]].forEach(([t, w2], i) => { const x = W - 34, y = H - 20 + i * 9; c.fillStyle = w2; c.fillRect(x, y - 2.5, 5, 5); c.fillStyle = '#595959'; c.fillText(t, x + 7, y + 0.5); });
}
function gambarSemuaPie(el, L) { el.querySelectorAll('canvas[data-pie]').forEach(cv => gambarPie(cv, L.perangkat[cv.dataset.pie])); }
// preview: pie digambar setelah elemen masuk ke halaman
new MutationObserver(() => { const pg = $('prev').querySelector('.sk > div'); if (pg && LAP && !pg.dataset.pie) { pg.dataset.pie = 1; gambarSemuaPie(pg, LAP); } }).observe($('prev'), {childList: true, subtree: true});

/* ================= EXPORT PDF ================= */
const PDF_LIB = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
const muatSkrip = src => new Promise((ok, bad) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = () => bad(new Error('Pustaka PDF gagal dimuat. Periksa koneksi internet.')); document.head.appendChild(t); });
$('btnPdf').onclick = async () => {
  const b = $('btnPdf'); if (b.disabled || !LAP) return;
  b.disabled = true; b.textContent = 'Menyiapkan PDF…';
  let pg = null;
  try {
    await Promise.all(PDF_LIB.map(muatSkrip));
    pg = halaman(LAP); pg.style.position = 'fixed'; pg.style.left = '-20000px'; pg.style.top = '0'; document.body.appendChild(pg);
    gambarSemuaPie(pg, LAP);
    await Promise.all([...pg.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(ok => { im.onload = im.onerror = ok; })));
    const cv = await window.html2canvas(pg, {scale: 2.5, backgroundColor: '#ffffff', logging: false});
    const pdf = new window.jspdf.jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
    // halaman lebih tinggi dari A4 (banyak lokasi): diperkecil agar tetap 1 halaman
    const rasio = cv.height / cv.width, w = rasio > 210 / 297 ? 210 / rasio : 297, h = w * rasio;
    pdf.addImage(cv.toDataURL('image/jpeg', 0.93), 'JPEG', (297 - w) / 2, 0, w, h);
    const nama = `Laporan Harian ${LAP.lokasi} ${LAP.tanggal}.pdf`.replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ');
    try { pdf.save(nama); } catch (e) { window.open(pdf.output('bloburl'), '_blank'); }
  } catch (e) { $('note').className = 'note err'; $('note').textContent = 'Export PDF gagal: ' + pesan(e); }
  finally { if (pg) pg.remove(); b.disabled = false; b.textContent = 'Export PDF'; }
};

/* ================= INPUT HARIAN ================= */
const IN = ['GpsT', 'GpsO', 'CamT', 'CamO', 'RtcT', 'RtcO'], KEY = {GpsT: 'gpsT', GpsO: 'gpsO', CamT: 'camT', CamO: 'camO', RtcT: 'rtcT', RtcO: 'rtcO'};
function hitungOff() {
  [['Gps', 'offGps'], ['Cam', 'offCam'], ['Rtc', 'offRtc']].forEach(([k, id]) => {
    const t = +$('in' + k + 'T').value, o = +$('in' + k + 'O').value, ada = $('in' + k + 'T').value !== '' && $('in' + k + 'O').value !== '';
    $(id).textContent = !ada ? '' : o > t ? 'Online melebihi jumlah terpasang.' : `Offline ${nf(t - o)} · Online ${t ? Math.round(o / t * 100) : 0}%`;
  });
}
IN.forEach(k => { $('in' + k).oninput = hitungOff; });
function isiForm(o, dariSebelumnya) {
  IN.forEach(k => { $('in' + k).value = o ? o[KEY[k]] : ''; });
  $('inOp').value = o ? o.operator || '' : ''; $('inSv').value = o ? o.supervisor || '' : '';
  $('inSub').textContent = dariSebelumnya ? `Belum ada data tanggal ini. Diisi dengan data ${tglPanjang(o.tanggal)}; periksa lalu simpan.` : o ? 'Data tanggal ini sudah ada; menyimpan akan menimpanya.' : 'Belum ada data. Offline dihitung otomatis.';
  hitungOff();
}
function muatForm() {
  $('inErr').textContent = ''; isiForm(null); $('inSub').innerHTML = '<span class="spin"></span>Memuat…';
  run('lhAmbilInput', TOKEN, $('inTgl').value, $('inLok').value).then(j => { const r = JSON.parse(j); isiForm(r.ada || r.sebelumnya, !r.ada && !!r.sebelumnya); })
    .catch(e => { if (!cekLogin(e)) $('inErr').textContent = pesan(e); });
}
$('btnInput').onclick = () => {
  if (!INFO) return;
  const a = INFO.akun, L = a.peran === 'LOKASI' ? [{n: a.lok}] : lokasiCakupan();
  $('inLok').innerHTML = L.map(o => `<option value="${esc(o.n)}">${esc(o.n)}</option>`).join('');
  $('inLok').disabled = a.peran === 'LOKASI';
  if ($('fLok').value) $('inLok').value = $('fLok').value;
  $('inTgl').value = $('fTgl').value;
  $('dlg').showModal(); muatForm();
};
$('inLok').onchange = muatForm; $('inTgl').onchange = muatForm;
$('inBatal').onclick = () => $('dlg').close();
$('fInput').onsubmit = e => {
  e.preventDefault();
  const o = {tanggal: $('inTgl').value, lokasi: $('inLok').value, operator: $('inOp').value, supervisor: $('inSv').value};
  for (const k of IN) { const v = $('in' + k).value; if (v === '') { $('inErr').textContent = 'Lengkapi semua jumlah (isi 0 bila tidak ada).'; return; } o[KEY[k]] = +v; }
  if (o.gpsO > o.gpsT || o.camO > o.camT || o.rtcO > o.rtcT) { $('inErr').textContent = 'Jumlah online tidak boleh lebih dari jumlah terpasang.'; return; }
  $('inSimpan').disabled = true; $('inErr').textContent = '';
  run('lhSimpanInput', TOKEN, o).then(() => { $('dlg').close(); if (o.tanggal !== $('fTgl').value) $('fTgl').value = o.tanggal; tampil(); })
    .catch(e => { if (!cekLogin(e)) $('inErr').textContent = pesan(e); }).finally(() => { $('inSimpan').disabled = false; });
};

mulai();
</script>
